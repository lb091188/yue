name: prebuilt

# Build the source distributions and the prebuilt static libraries for the
# MoonBit bindings (github.com/NoahLiu/moonbit-libyue).  Tag names for this
# workflow follow the pattern v<upstream>-mbt.<n>, e.g. v0.15.6-mbt.1, and
# produce a draft release with:
#   libyue_<version>_<os>.zip                  source distribution
#   libyue_prebuilt_<version>_<os>_<arch>.zip  headers + static libraries
on:
  push:
    tags:
      - 'v*-mbt*'
  workflow_dispatch:

jobs:
  prebuilt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: mac
            runner: macos-15
          - target: win
            runner: windows-2022

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt update -qq
          sudo apt install -qq cmake libgtk-3-dev libnotify-dev libwebkit2gtk-4.1-dev
          # 注意：不把 cc/c++ 切到 clang。下游消费方的 shim 用各自系统的
          # gcc 编译，libyue 预构建库若为 clang 产物，gcc shim 与之混链会
          # 在运行期稳定段错误（Window::SetContentView 路径实测），
          # 静态库必须与 shim 同编译器家族。
          # 用 ubuntu-24.04 的 gcc-13：22.04 的 gcc-11 编不动 vendored
          # Chromium 头里的类内推导指引（weak_ptr.h）。代价是预构建库的
          # glibc 门槛为 24.04（2.39），更老发行版自动回退源码构建。

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: python -m pip install --upgrade setuptools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: prebuilt-${{ matrix.target }}

      - name: Bootstrap
        run: node scripts/bootstrap.js --cc-wrapper=ccache

      # MoonBit 绑定链路的自有补丁(third_party/yoga 是子模块,源码在
      # 打包/构建前落盘)。补丁内路径相对子模块根。
      - name: Apply yoga patches
        shell: bash
        run: git -C third_party/yoga apply --verbose "$GITHUB_WORKSPACE/patches/yoga-display-none-flex-basis.patch"

      - name: Create source distribution
        shell: bash
        run: |
          # macos-15(arm64) runner 实测出现过中途静默终结:日志止于 ninja 进度行、
          # 无任何编译诊断(Windows 同类失败带有完整 FAILED 块),故整步最多重试
          # 一次,两次都失败才判定为真失败。
          set +e
          code=1
          attempt=0
          for attempt in 1 2; do
            node scripts/create_source_dist.js --cc-wrapper=ccache >/tmp/csd.out 2>&1
            code=$?
            if [ $code -eq 0 ]; then break; fi
            echo "第 $attempt 次尝试失败(退出码 $code),日志留档 /tmp/csd.attempt$attempt.out"
            cp /tmp/csd.out /tmp/csd.attempt$attempt.out
          done
          set -e
          if [ $code -ne 0 ]; then
            # GitHub 每步只保留 10 条注解,所以上报 1 条环境快照 + 最多 9 条日志里
            # 最有信息量的行(先挑错误/失败相关行,不足再补输出末尾)。行内 %
            # 转义成 %25,否则注解解析会吃掉其后的内容。
            esc() { printf '%s' "$1" | sed 's/%/%25/g'; }
            echo "::error title=source-dist 环境::尝试 $attempt 次;$(df -h . 2>/dev/null | tail -1 | tr -s ' ');$(vm_stat 2>/dev/null | sed -n '2,3p' | tr -s ' ' | tr '\n' ' ')"
            grep -aE 'error|Error|FAILED|ninja: |undefined|ld: |fatal|Asserti' /tmp/csd.out >/tmp/csd.sel || true
            sel=$(wc -l </tmp/csd.sel | tr -d ' ')
            if [ "$sel" -lt 9 ]; then
              tail -n $((9 - sel)) /tmp/csd.out >>/tmp/csd.sel
            fi
            while IFS= read -r line; do
              echo "::error title=source-dist 关键行::$(esc "$line")"
            done < /tmp/csd.sel
          fi
          exit $code

      - name: Create prebuilt libraries
        run: node scripts/create_prebuilt_lib.js

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: out/Dist/*.zip
          retention-days: 5

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prebuilt]
    runs-on: ubuntu-latest
    permissions:
      # Needed by action-gh-release.
      contents: write

    steps:
      - name: Download Files
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # 直接发布：下游 prepare.py 按版本号拉资产，草稿资产不可下载。
          draft: false
          name: Yue ${{ github.ref_name }}
          body: '## Changelog'
          files: '*.zip'
